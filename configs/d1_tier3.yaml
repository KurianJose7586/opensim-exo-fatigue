# D1 population sweep. # 100,000 solves: full
# subjects x conditions_per_subject x assist_per_condition twin evaluations.
name: d1_tier3
seed: 0
subjects: 500
conditions_per_subject: 10
assist_per_condition: 20
ranges:                       # ponytail: plausible adult ranges, not fitted to a population
  mass_scale: [0.8, 1.25]     # x every segment mass of the 75 kg base model
  strength_scale: [0.7, 1.3]  # x every muscle's max isometric force
  speed_scale: [0.8, 1.25]    # x walking tempo (time-scaled reference kinematics)
  load_kg: [0.0, 20.0]        # backpack on the torso
  p: [0.0, 0.4]               # assistance fraction per joint (hip, knee, ankle)
  # hidden: domain randomisation (Luo et al. 2024), never observed by surrogate/policy
  fiber_length_scale: [0.9, 1.1]   # x optimal fiber length, tendon slack compensates
  exo_capacity_scale: [0.7, 1.0]   # delivered / nominal device torque cap
  device_mass_scale: [0.5, 1.5]    # x DEVICE_MASS in twin.py
